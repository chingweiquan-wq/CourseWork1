<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us </title>
    <style>
        a {
            color: white;
            text-decoration: none;
        }
        a:hover {
            color: #00ffcc;
        }
    </style>
</head>
<body style="background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; text-align: center; padding: 20px;">

    <header style="background-color: #1f1f1f; padding: 15px; margin-bottom: 20px;">
        <span style="color: #00ffcc; font-weight: bold; float: left;">GAMING WORLD</span>
        <a href="First%20Page.html" style="color: white; text-decoration: none; margin-left: 15px;">Home</a>
        <a href="Index.html" style="color: white; text-decoration: none; margin-left: 15px;">Top 5 Games</a>
        <a href="#news" style="color: white; text-decoration: none; margin-left: 15px;">News</a>
        <a href="contact.html" style="color: #00ffcc; text-decoration: none; margin-left: 15px;">Contact</a>
        <div style="clear: both;"></div>
    </header>

    <div style="background-color: #1f1f1f; padding: 30px; margin-bottom: 30px;">
        <h1 style="color: #00ffcc; margin-bottom: 10px;">Get in Touch</h1>
        <p style="color: #b0b0b0; font-size: 1.1rem;">Have a question, feedback, or game recommendation? Drop a message below!</p>
    </div>

    <div style="max-width: 600px; margin: 0 auto; text-align: left; padding: 20px; background-color: #1f1f1f; border-radius: 8px;">
        
        <form action="#" method="POST">
            
            <div style="margin-bottom: 20px;">
                <label for="name" style="display: block; color: #00ffcc; margin-bottom: 8px; font-weight: bold;">Your Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name..." style="width: 100%; padding: 12px; background-color: #121212; border: 1px solid #333; color: #ffffff; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="email" style="display: block; color: #00ffcc; margin-bottom: 8px; font-weight: bold;">Your Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address..." style="width: 100%; padding: 12px; background-color: #121212; border: 1px solid #333; color: #ffffff; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 25px;">
                <label for="message" style="display: block; color: #00ffcc; margin-bottom: 8px; font-weight: bold;">Your Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="Type your message here..." style="width: 100%; padding: 12px; background-color: #121212; border: 1px solid #333; color: #ffffff; border-radius: 4px; box-sizing: border-box; resize: vertical;"></textarea>
            </div>

            <div style="text-align: center;">
                <button type="submit" style="background-color: #00ffcc; color: #121212; padding: 12px 30px; border: none; font-weight: bold; font-size: 1rem; border-radius: 4px; cursor: pointer;">Send Message</button>
            </div>

        </form>

    </div>

    <div style="text-align: center; margin-top: 30px;">
        <a href="Index.html" style="color: #00ffcc; font-weight: bold; font-size: 1.1rem;">Back to Home</a>
    </div>


</body>
</html>
